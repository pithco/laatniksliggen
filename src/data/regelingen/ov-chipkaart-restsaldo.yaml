slug: ov-chipkaart-restsaldo
naam: Restsaldo OV-chipkaart
categorie: vergeten
gemeente: ""
samenvatting: >-
  Staat er nog geld op een oude OV-chipkaart? Dat kunt u terugvragen op uw rekening. Ook als de
  kaart al verlopen is, zolang u binnen 5 jaar na de einddatum bent.
voorWie: >-
  Mensen met een persoonlijke of anonieme OV-chipkaart waarop nog saldo staat. Een zakelijke
  kaart regelt u via uw werkgever.
bedragKort: Het saldo dat nog op de kaart staat
bedrag: >-
  U krijgt het restsaldo terug dat nog op de kaart staat. Er is geen vast bedrag. Op
  ov-chipkaart.nl staat dat het bedrag binnen 15 dagen op uw rekening wordt gestort.
bedragZeker: true
deadline: >-
  Is de kaart verlopen, dan kunt u het saldo tot 5 jaar na de vervaldatum terugvragen. Is de
  kaart nog geldig, dan kan terugvragen ook. Een nog geldige kaart moet u soms eerst beëindigen
  bij een automaat.
deadlineZeker: true
stappen:
  - Zoek het kaartnummer en de einddatum. Die staan op de kaart.
  - Vul het formulier in op ov-chipkaart.nl/saldo-terugvragen.
  - >-
    Houd uw IBAN bij de hand. Een zakelijke kaart vraagt u niet hier terug, maar via uw
    werkgever.
voorwaarden:
  - Het gaat om saldo op een OV-chipkaart, niet om een abonnement bij een vervoerder.
  - >-
    Bij een kaart die nog geldig is, kunt u de kaart soms pas beëindigen nadat abonnementen zijn
    stopgezet.
  - Na beëindigen werkt de kaart niet meer voor OV-fiets, stalling of P+R.
bronnen:
  - naam: OV-chipkaart — saldo terugvragen
    url: https://www.ov-chipkaart.nl/saldo-terugvragen
  - naam: OV-chipkaart — saldo checken en termijn
