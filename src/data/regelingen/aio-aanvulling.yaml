slug: aio-aanvulling
naam: AOW en AIO-aanvulling
categorie: toeslag
gemeente: ""
samenvatting: >-
  AOW is het basispensioen van de SVB. Is je AOW niet compleet, of heb je naast een volledige
  AOW bijna geen ander inkomen? Dan is er soms een aanvulling: de AIO. Die vraag je zelf aan.
  Doe eerst de AIO-check.
voorWie: >-
  Mensen die in Nederland wonen, de AOW-leeftijd hebben en weinig ander inkomen en vermogen
  hebben. Ook met een volledige AOW kan het soms, als je partner de AOW-leeftijd nog niet heeft
  en je samen weinig inkomen en vermogen hebt.
bedragKort: Aanvulling tot maximaal € 1.486,46 netto per maand als je alleen woont (2026)
bedrag: >-
  De AIO vult aan tot een maximum. Vanaf 1 januari 2026 is dat netto per maand, exclusief
  vakantiegeld: € 1.486,46 als je alleen woont, en € 2.036,95 samen als je met je partner woont.
  Het vakantiegeld komt daar bovenop en wordt in mei betaald: € 78,23 als je alleen woont. Van
  de AIO gaan nog loonheffing en een bijdrage voor de zorgverzekering af. Heb je zelf AOW of
  ander inkomen, dan krijg je alleen het verschil.
bedragZeker: true
deadline: >-
  Er is geen vaste sluitingsdatum. Vanaf 2 maanden voor je AOW-leeftijd kun je de AIO-check doen
  en het formulier downloaden. In 2026 is de AOW-leeftijd 67 jaar. Je eigen leeftijd hangt af
  van je geboortedatum. Die vul je in bij de SVB.
deadlineZeker: true
stappen:
  - >-
    Ga naar svb.nl en zoek op AOW-leeftijd. Vul je geboortedatum in. Zo zie je wanneer je AOW
    krijgt.
  - "Vanaf 2 maanden voor die leeftijd: ga naar svb.nl, zoek op AIO-check en vul de check in."
  - >-
    Zegt de check dat aanvragen zin heeft, download dan het formulier, vul het in en stuur het
    naar de SVB.
voorwaarden:
  - Je hebt de AOW-leeftijd en je woont in Nederland.
  - Je hebt geen AOW of geen volledige AOW, weinig ander inkomen en niet te veel vermogen.
  - >-
    Of: je hebt wel een volledige AOW, maar je partner nog niet, en je hebt samen weinig inkomen
    en vermogen.
