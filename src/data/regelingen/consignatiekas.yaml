slug: consignatiekas
naam: Consignatiekas
categorie: vergeten
gemeente: ""
samenvatting: >-
  In de consignatiekas bewaart het ministerie van Financiën geld waarvan niet duidelijk is wie
  het mag ontvangen, of waarvan de rechthebbende het nog niet heeft aangenomen. Je kunt op naam
  zoeken en daarna een claim indienen.
voorWie: >-
  Mensen die denken dat er geld op hun naam of op naam van een erfgenaam in bewaring staat.
  Bijvoorbeeld uit een erfenis, een faillissement, schuldsanering of onteigening.
bedragKort: Geen exact bedrag online. Je ziet alleen een indicatie
bedrag: >-
  Het zoekformulier toont geen exact bedrag. Je ziet een indicatie: minder dan € 50, € 50 tot en
  met € 200, of meer dan € 200. Voor het beheer rekent het ministerie geen kosten. Over
  consignaties vanaf € 45,38 krijg je bij uitbetaling enkelvoudige rente.
bedragZeker: true
deadline: >-
  Consignaties vanaf 1980 blijven 20 jaar bewaard. Daarna vervalt het geld aan de Staat. Voor
  consignaties van vóór 1980 en voor bedragen tot € 45,38 is de termijn 60 jaar. Er is geen
  aparte aanvraagmaand.
deadlineZeker: true
stappen:
  - Ga naar het formulier van de Rijksoverheid via de link hieronder. Zoek of je naam voorkomt.
  - Leg bewijs klaar dat jij recht hebt op het bedrag, plus een legitimatie.
  - >-
    Stuur het verzoek naar de Consignatiekas van het ministerie van Financiën. Het adres staat
    op het formulier.
voorwaarden:
  - Je kunt aantonen dat je de rechthebbende bent, of dat je namens die persoon mag handelen.
  - In de kas zit alleen geld, geen spullen.
  - >-
    Het geld kan onder meer komen uit nalatenschappen, faillissementen, schuldsanering,
    onteigening of niet-opgeëiste waardepapieren.
