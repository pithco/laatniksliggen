slug: breda-inkomenstoeslag
naam: Individuele inkomenstoeslag in Breda
categorie: gemeente
gemeente: breda
samenvatting: >-
  Heb je minimaal 5 jaar een bijstandsuitkering of een laag inkomen? Dan kun je in Breda een
  jaarlijkse individuele inkomenstoeslag krijgen. Je mag zelf weten waaraan je het geld
  uitgeeft.
voorWie: Inwoners van Breda met 5 jaar een laag inkomen en weinig vermogen.
bedragKort: € 150 of € 250 per jaar, volgens de gemeentepagina
bedrag: >-
  De gemeente noemt maximaal € 150 voor een alleenstaande en € 250 voor een samenwonende,
  gehuwde of alleenstaande ouder. Het bedrag wordt in één keer betaald. Een peildatum staat niet
  bij de bedragen.
bedragZeker: false
deadline: >-
  De pagina noemt geen sluitingsdatum. Je vraagt de toeslag aan als je 5 jaar aan de voorwaarden
  voldoet.
deadlineZeker: true
stappen:
  - Ga naar breda.nl en open de pagina Inkomenstoeslag.
  - >-
    Vraag de toeslag aan bij de gemeente. Gebruik de knop op de pagina en log in met DigiD als
    daarom gevraagd wordt.
  - Je hoeft geen bonnen te bewaren voor de besteding.
voorwaarden:
  - Je woont in Breda.
  - Je hebt minimaal 5 jaar een laag inkomen en weinig vermogen.
  - >-
    Vermogen volgens de pagina: maximaal € 8.000 alleenstaand, of € 16.000 voor een
    alleenstaande ouder of paar.
bronnen:
  - naam: Gemeente Breda — inkomenstoeslag
    url: https://www.breda.nl/inkomenstoeslag
laatstGecontroleerd: "2026-10-16"
onzeker:
  - >-
    De pagina noemt bedragen en inkomensgrenzen zonder peildatum. Of die voor 2026 gelden, is te
    controleren.
  - De minimumleeftijd stond niet op de pagina die we hebben gelezen. Dat is te controleren.
trefwoorden:
  - breda
  - iit
check:
  soort: inkomenstoeslag
  minLeeftijd: 21
  geenAow: true
  leeftijdZeker: false
