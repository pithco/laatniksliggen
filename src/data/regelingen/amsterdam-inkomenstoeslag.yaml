slug: amsterdam-inkomenstoeslag
naam: Individuele inkomenstoeslag in Amsterdam
categorie: gemeente
gemeente: amsterdam
samenvatting: >-
  Heb je 3 jaar of langer een laag inkomen en verwacht je dat dit zo blijft? Dan kun je in
  Amsterdam de individuele inkomenstoeslag aanvragen.
voorWie: >-
  Inwoners van Amsterdam of Weesp, 21 jaar of ouder, zonder AOW, met in 2023, 2024 en 2025 een
  laag inkomen en weinig vermogen.
bedragKort: € 85 per jaar alleen, € 170 samen (pagina gemeente)
bedrag: >-
  De gemeente schrijft: € 85 per jaar als je alleenstaand of alleenstaande ouder bent, en € 170
  als je samenwoont en je beiden recht hebt. Je krijgt binnen 8 weken een brief.
bedragZeker: true
deadline: >-
  Je vraagt de toeslag aan als je over de jaren 2023, 2024 en 2025 aan de voorwaarden voldeed.
  Er is geen andere sluitingsdatum op de pagina.
deadlineZeker: true
stappen:
  - Ga naar amsterdam.nl en open de check voor de individuele inkomenstoeslag.
  - >-
    Log in met DigiD en kies de individuele inkomenstoeslag. Vul de vragen in en verstuur de
    aanvraag.
  - Heb je geen DigiD, download dan het formulier op de pagina of bel 020 252 6000.
voorwaarden:
  - Je staat ingeschreven in Amsterdam of Weesp.
  - Je bent 21 jaar of ouder en je hebt geen AOW.
  - Je had in 2023, 2024 en 2025 een laag inkomen en weinig vermogen.
bronnen:
  - naam: Gemeente Amsterdam — extra geld bij lang een laag inkomen
    url: >-
      https://www.amsterdam.nl/werk-en-inkomen/regelingen-bij-laag-inkomen-pak-je-kans/regelingen-alfabet/extra-geld-als-u-al-lang-een-laag/
laatstGecontroleerd: "2026-10-16"
onzeker:
  - >-
    Op de pagina staat geen apart jaartal bij € 85 en € 170. Controleer of dit het bedrag voor
    je aanvraagjaar is.
trefwoorden:
  - amsterdam
  - iit
  - langdurig laag inkomen
check:
  soort: inkomenstoeslag
  minLeeftijd: 21
  geenAow: true
