slug: haarlem-minimaregeling
naam: HaarlemPas
categorie: gemeente
gemeente: haarlem
samenvatting: >-
  Met een laag inkomen kun je de HaarlemPas aanvragen. Daarmee vraag je meerdere regelingen aan,
  zoals vergoeding van het eigen risico en schoolkosten. Kinderen kunnen gratis sporten, dansen
  of naar muziekles. Er is ook korting op theater en film.
voorWie: >-
  Inwoners met een laag inkomen. Krijg je bijstand, schuldsanering, schuldhulpverlening of
  kwijtschelding, dan krijg je de pas vaak automatisch.
bedragKort: Geen vast jaarbedrag. De pas opent andere regelingen
bedrag: >-
  De pagina noemt geen prijs voor de pas en geen enkel tegoed dat iedereen krijgt. De waarde zit
  in de regelingen die je ermee aanvraagt.
bedragZeker: true
deadline: >-
  Heb je ná 1 oktober kwijtschelding gekregen en nog geen pas, dan vraag je de pas zelf aan. Zo
  staat het op de pagina.
deadlineZeker: true
stappen:
  - Ga naar haarlem.nl en vraag de HaarlemPas aan met DigiD, of doe het samen met Buurts.
  - Krijg je al bijstand of kwijtschelding, kijk dan op de pagina of de pas automatisch komt.
  - Een vraag, bel dan op werkdagen van 8.30 tot 12.00 uur en vraag naar team Minima.
voorwaarden:
  - Je hebt een laag inkomen.
  - >-
    De vermogensbedragen zijn deels genoemd op de pagina. Neem de tabel op haarlem.nl als bron,
    niet een samenvatting.
bronnen:
  - naam: Gemeente Haarlem — HaarlemPas
    url: https://haarlem.nl/haarlempas
laatstGecontroleerd: "2026-10-16"
onzeker:
  - >-
    De volledige vermogens- en inkomensgrenzen van de HaarlemPas zijn te controleren op de
    pagina. We hebben niet de hele tabel overgenomen.
trefwoorden:
  - haarlem
  - haarlempas
check:
  soort: minima
  minLeeftijd: 18
