slug: den-haag-minimaregeling
naam: Ooievaarspas in Den Haag
categorie: gemeente
gemeente: den-haag
samenvatting: >-
  De Ooievaarspas is een gratis pas voor inwoners met een laag inkomen. Je kunt er sporten, naar
  een concert of een cursus doen. De gemeente betaalt veel activiteiten, of je krijgt korting.
voorWie: >-
  Inwoners van Den Haag met een inkomen tot 150% van de bijstandsnorm en vermogen onder de
  grens. De pas geldt ook in Leidschendam-Voorburg en Rijswijk, met daar een grens van 130%.
bedragKort: De pas is gratis. Geen vast geldbedrag
bedrag: >-
  Je betaalt niets voor de pas. De waarde zit in activiteiten die de gemeente betaalt of korting
  geeft. Een vast jaarbedrag in euro’s staat niet op de pagina.
bedragZeker: true
deadline: >-
  Krijg je automatisch een brief, gebruik dan die brief. Ben je de brief kwijt, bel dan de
  klantenservice (070) 353 75 00.
deadlineZeker: true
stappen:
  - Kijk of je de brief van de Ooievaarspas al in huis hebt.
  - >-
    Geen brief, ga dan naar denhaag.nl, open de Ooievaarspas en vraag de pas aan. Log in met
    DigiD als daarom gevraagd wordt.
  - Kijk daarna op dezelfde site bij het overzicht van Ooievaarsregelingen wat er nu op zit.
voorwaarden:
  - Je woont in Den Haag en je inkomen is tot 150% van de bijstandsnorm.
  - Je vermogen blijft onder de vermogensgrens.
  - >-
    Studeert je aan hbo of universiteit, dan heb je geen recht als je een lening of aanvullende
    beurs van DUO hebt. Zo staat het op de pas-site.
