slug: arnhem-minimaregeling
naam: Gelrepas in Arnhem
categorie: gemeente
gemeente: arnhem
samenvatting: >-
  De Gelrepas is een pas met tegoed voor musea, sport, attracties, film en cursussen. De pas is
  één kalenderjaar geldig. Studenten kunnen hem niet aanvragen.
voorWie: Inwoners van Arnhem met een laag inkomen, geen studenten.
bedragKort: "Tegoed in 2026: € 100, € 200 of € 335, afhankelijk van leeftijd"
bedrag: >-
  In 2026: € 100 voor 0 tot en met 3 jaar, € 335 voor 4 tot en met 17 jaar, en € 200 voor 18
  jaar en ouder. Daarnaast is er korting op activiteiten. Een nieuwe pas kost niets volgens de
  aanvraagpagina. Een vervangende pas kost € 5, afgeschreven van het tegoed.
bedragZeker: true
deadline: >-
  Vraag je de pas na 1 november aan, dan geldt de aanvraag voor het nieuwe jaar. Je hoort binnen
  8 weken of je de pas krijgt.
deadlineZeker: true
stappen:
  - Ga naar arnhem.nl en vraag de Gelrepas aan. Log in met DigiD als de site daarom vraagt.
  - "Per post kan ook: Team Minima, antwoordnummer 3740, 6800 XA Arnhem."
  - Kijk daarna op gelrepas.nl welke aanbiedingen er nu op zitten.
voorwaarden:
  - Je woont in Arnhem, je hebt een laag inkomen en je bent geen student.
  - De precieze inkomensgrens in euro’s is te controleren.
  - Een verloren pas vervangt je via pashouders@gelrepas.nl, niet via de gemeente.
