slug: haarlemmermeer-kwijtschelding
naam: Kwijtschelding belastingen in Haarlemmermeer
categorie: gemeente
gemeente: haarlemmermeer
samenvatting: >-
  Inwoners met een laag inkomen kunnen kwijtschelding krijgen van de afvalstoffenheffing en het
  liggeld voor woonschepen. De gemeente gebruikt een 100%-norm. Dat is het wettelijke maximum.
voorWie: Inwoners met een laag inkomen. De gemeente toetst betalingscapaciteit en vermogen.
bedragKort: De afvalstoffenheffing of het liggeld, geheel of deels
bedrag: >-
  Er is geen vast bedrag per persoon. Je hoeft de heffing niet, of maar voor een deel, te
  betalen. Minimaal 80% van de betalingscapaciteit moet volgens de wettelijke systematiek naar
  belastingschulden. Haarlemmermeer kent een 100%-norm.
bedragZeker: true
deadline: Hoe en tot wanneer je aanvraagt, staat niet in de begrotingstekst. Dat is te controleren.
deadlineZeker: false
stappen:
  - Ga naar haarlemmermeer.nl en zoek op kwijtschelding. Volg de stappen op die pagina.
  - Houd je inkomens- en vermogensgegevens bij de hand. Die vul je in op het formulier.
  - Extra rolcontainers voor afval vallen buiten de kwijtschelding, volgens de jaarstukken.
voorwaarden:
  - Kwijtschelding kan voor de afvalstoffenheffing en het liggeld voor woonschepen.
  - Niet voor extra rolcontainers.
  - De gemeente hanteert de 100%-norm.
