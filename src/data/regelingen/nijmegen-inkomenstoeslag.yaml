slug: nijmegen-inkomenstoeslag
naam: Individuele inkomenstoeslag in Nijmegen
categorie: gemeente
gemeente: nijmegen
samenvatting: >-
  Verwacht je geen hoger inkomen en heb je al langer weinig inkomsten? Dan kun je in Nijmegen
  maximaal één keer per 12 maanden individuele inkomenstoeslag aanvragen. Kreeg je hem vorig
  jaar, dan stuurt de gemeente een brief.
voorWie: >-
  Inwoners van 21 jaar tot de AOW-leeftijd, geen student, die 36 maanden een laag inkomen
  hadden.
bedragKort: € 240 tot € 655 in 2026, afhankelijk van wonen en gezin
bedrag: >-
  Maximale bedragen 2026 als je zelfstandig woont: € 465 alleenstaand, € 590 alleenstaand met
  kinderen of co-ouder, € 655 getrouwd of samenwonend. Woon je in een instelling, dan zijn de
  bedragen lager: € 240, € 305 of € 340. Vermogen maximaal € 8.000 of € 16.000.
bedragZeker: true
deadline: Maximaal één keer per 12 maanden. De pagina noemt geen andere sluitingsdatum.
deadlineZeker: true
stappen:
  - >-
    Ga naar de pagina van Nijmegen, klik op aanvragen en log in met DigiD. Verstuur het
    formulier.
  - Kreeg je vorig jaar deze toeslag, wacht dan op de brief.
  - Kom je er niet uit, bel dan 14 024.
voorwaarden:
  - Je woont in Nijmegen en je bent 21 jaar of ouder, jonger dan de AOW-leeftijd.
  - Je bent geen student en je hebt de afgelopen 36 maanden geen studiediploma behaald.
  - Heb je of je partner AOW, dan krijg je geen individuele inkomenstoeslag.
