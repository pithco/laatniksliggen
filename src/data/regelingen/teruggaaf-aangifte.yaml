slug: teruggaaf-aangifte
naam: Teruggaaf via de belastingaangifte
categorie: belasting
gemeente: ""
samenvatting: >-
  Heb je geen aangiftebrief gehad? Dan kun je toch geld terugkrijgen. Bijvoorbeeld als je niet
  het hele jaar werkte, studeerde, kinderen hebt of maar een deel van het jaar in Nederland
  woonde. Je ziet het bedrag als je de aangifte invult.
voorWie: >-
  Mensen van wie loonheffing is ingehouden en die misschien te veel hebben betaald. Ook als je
  niet verplicht bent om aangifte te doen.
bedragKort: Verschilt per jaar. Je ziet het bedrag in de aangifte
bedrag: >-
  Er is geen vast bedrag. De Belastingdienst laat het zien zodra je de aangifte invult. Invullen
  is nog geen aangifte: pas als je verstuurt, doe je aangifte. Denkt je dat je over het lopende
  jaar geld terugkrijgt, dan kun je een voorlopige aanslag aanvragen.
bedragZeker: true
deadline: >-
  Zonder aangiftebrief kun je tot 5 jaar na afloop van een jaar aangifte doen. In 2026 kun je
  dus nog over 2021 tot en met 2025 belasting terugvragen. Aangifte over 2021 moet uiterlijk op
  31 december 2026 binnen zijn. Moet je wel aangifte doen, dan geldt de datum op je
  aangiftebrief. Dat is vaak 1 mei.
deadlineZeker: true
stappen:
  - Ga naar Mijn Belastingdienst op belastingdienst.nl en log in met DigiD.
  - Open de aangifte en loop de gegevens na die al ingevuld zijn. Verstuur nog niks.
  - Krijg je geld terug, of moet je aangifte doen, klik dan op versturen.
voorwaarden:
  - Er is loonheffing ingehouden op loon of een uitkering.
  - Je hebt geen aangiftebrief nodig om geld terug te vragen.
  - >-
    Zie je bij het invullen dat je € 58 of meer moet betalen, dan ben je in veel gevallen wél
    verplicht de aangifte te versturen.
