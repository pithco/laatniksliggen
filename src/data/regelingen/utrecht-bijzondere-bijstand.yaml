slug: utrecht-bijzondere-bijstand
naam: Bijzondere bijstand in Utrecht
categorie: gemeente
gemeente: utrecht
samenvatting: >-
  Utrecht geeft bijzondere bijstand voor extra kosten die u niet kunt betalen en die u wel echt
  moet maken. Op de pagina staan voorbeelden, zoals baby-uitzet en een deel van de kraamzorg.
  Soms ook extra energiekosten door ziekte of een slecht geïsoleerd huis.
voorWie: >-
  Inwoners met kosten die niet vanuit een andere regeling worden betaald. Voor een deel van de
  voorbeelden noemt de gemeente een laag inkomen en weinig vermogen.
bedragKort: "Hangt af van de kosten. Voorbeelden: maximaal € 600 en € 200"
bedrag: >-
  Er is geen enkel bedrag voor alle kosten. De gemeente noemt wel: maximaal € 600 voor de eerste
  babyspullen, en maximaal € 200 voor de eigen bijdrage kraamzorg. Andere kosten worden apart
  bekeken.
bedragZeker: true
deadline: >-
  Geen vaste sluitingsdatum op de overzichtspagina. Hulp bij de aanvraag kan via het buurtteam
  of Werk en Inkomen, telefoon 14 030.
deadlineZeker: true
stappen:
  - Lees de voorbeelden op de pagina Geld en hulp bij rondkomen.
  - Vraag bijzondere bijstand aan, eventueel met hulp van het buurtteam.
  - Bewaar rekeningen en offertes.
voorwaarden:
  - De kosten zijn nodig en niet verwacht, en u kunt ze niet zelf betalen.
  - Voor babyspullen noemt de gemeente een maximum van € 600.
  - Voor de eigen bijdrage kraamzorg noemt de gemeente een maximum van € 200.
bronnen:
  - naam: Gemeente Utrecht — geld en hulp bij rondkomen
    url: https://www.utrecht.nl/werk-en-inkomen/geld-en-hulp-bij-rondkomen
laatstGecontroleerd: "2026-10-16"
onzeker: []
trefwoorden:
