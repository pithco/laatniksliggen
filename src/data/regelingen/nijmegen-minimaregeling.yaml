slug: nijmegen-minimaregeling
naam: Meedoenregeling in Nijmegen
categorie: gemeente
gemeente: nijmegen
samenvatting: >-
  Met de Meedoenregeling kunnen inwoners met een laag inkomen voor maximaal € 150 een cursus of
  activiteit doen, zoals zwemmen, zang, yoga of theater. Je mag het tegoed verdelen over meer
  activiteiten.
voorWie: >-
  Inwoners van Nijmegen met een laag inkomen. De precieze inkomensgrens is te controleren op de
  aanvraagpagina.
bedragKort: Maximaal € 150
bedrag: >-
  Je krijgt maximaal € 150 voor een cursus of activiteit. Het is geen vrij geld op je rekening,
  maar tegoed voor de activiteit.
bedragZeker: true
deadline: >-
  De regeling is aan te vragen tot en met 31 december 2026. Zo staat het op de pagina met
  vergoedingen van de gemeente.
deadlineZeker: true
stappen:
  - Ga naar nijmegen.nl en lees de Meedoenregeling.
  - Ga naar vergoedingen.nijmegen.nl, log in als daarom gevraagd wordt en dien de aanvraag in.
  - Je mag het tegoed van € 150 over meer dan één activiteit verdelen.
voorwaarden:
  - Je hebt een laag inkomen.
  - Het maximum is € 150.
  - Aanvragen kan tot en met 31 december 2026.
