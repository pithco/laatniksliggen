slug: haarlem-inkomenstoeslag
naam: Individuele inkomenstoeslag in Haarlem
categorie: gemeente
gemeente: haarlem
samenvatting: >-
  Als je 3 jaar of langer weinig verdient, kun je in Haarlem één keer per jaar individuele
  inkomenstoeslag aanvragen. Kreeg je hem vorig jaar, dan stuurt de gemeente een brief.
voorWie: >-
  Inwoners tussen 21 jaar en de AOW-leeftijd. Een maatregel op een uitkering in de afgelopen 3
  jaar kan de toeslag in de weg zitten.
bedragKort: € 488, € 626 of € 694
bedrag: >-
  De gemeente noemt € 488 voor een alleenstaande, € 626 voor een alleenstaande ouder en € 694
  als je samenwoont of getrouwd bent. Vermogen niet meer dan € 8.000 alleen, of € 16.000 samen
  of met een kind. Een auto tot € 3.500 telt niet mee.
bedragZeker: false
deadline: >-
  Eén keer per jaar. De brief komt als je de toeslag vorig jaar kreeg. Een andere kalenderdatum
  staat niet in de tekst die we zagen.
deadlineZeker: true
stappen:
  - >-
    Ga naar haarlem.nl, open de individuele inkomenstoeslag en vraag aan met DigiD.
    Bewindvoerders gebruiken eHerkenning.
  - Kreeg je de toeslag al, wacht dan op de brief van de gemeente.
  - Kom je er niet uit, vraag dan hulp via Buurts. Haarlem noemt dat op de pagina.
voorwaarden:
  - Je bent tussen de 21 jaar en de AOW-leeftijd.
  - Je verdient 3 jaar of langer weinig.
  - De inkomensbedragen op de pagina hebben in onze bron geen jaartal.
bronnen:
  - naam: Gemeente Haarlem — individuele inkomenstoeslag
    url: https://haarlem.nl/individuele-inkomenstoeslag
laatstGecontroleerd: "2026-10-16"
onzeker:
  - Bij de bedragen en de inkomensgrenzen staat geen jaartal. Dat is te controleren.
trefwoorden:
  - haarlem
  - iit
check:
  soort: inkomenstoeslag
  minLeeftijd: 21
  geenAow: true
