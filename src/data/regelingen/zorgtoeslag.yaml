slug: zorgtoeslag
naam: Zorgtoeslag
categorie: toeslag
gemeente: ""
samenvatting: >-
  Zorgtoeslag is geld van de overheid voor de premie van je zorgverzekering. Veel mensen vragen
  dit niet aan. Als je 18 jaar of ouder bent en je inkomen en spaargeld niet te hoog zijn, kun
  je het aanvragen.
voorWie: >-
  Mensen van 18 jaar of ouder met een Nederlandse zorgverzekering. Je toetsingsinkomen en je
  vermogen moeten onder de grens blijven. Heb je een toeslagpartner, dan telt die mee.
bedragKort: Maximaal € 129 per maand als je alleen bent (2026)
bedrag: >-
  In 2026 krijg je maximaal € 129 per maand als je alleen bent en je toetsingsinkomen niet hoger
  is dan € 29.500. Met een toeslagpartner is het maximum dan € 246 per maand samen. Het bedrag
  daalt als het inkomen stijgt. Je krijgt geen zorgtoeslag als je toetsingsinkomen hoger is dan
  € 40.857. Samen met een toeslagpartner is die grens € 51.142. Op 1 januari 2026 mag je
  vermogen niet hoger zijn dan € 146.011, of € 184.633 samen met een toeslagpartner.
bedragZeker: true
deadline: >-
  Zorgtoeslag over 2026 kun je aanvragen tot en met 31 december 2027. Over 2025 kan dat nog tot
  en met 31 december 2026. Heb je uitstel voor je belastingaangifte, dan kun je soms langer de
  tijd hebben.
deadlineZeker: true
stappen:
  - >-
    Ga naar belastingdienst.nl en zoek op proefberekening. Vul je gegevens in. Verstuur nog
    niks. Zo zie je ongeveer wat je krijgt.
  - >-
    Ga naar Mijn Toeslagen op belastingdienst.nl. Log in met DigiD. Kies de toeslag, vul de
    vragen in en klik door tot je de aanvraag verstuurt.
  - >-
    Kijk elk jaar of je inkomen en je woonsituatie nog kloppen. Veranderde er iets, pas het dan
    aan in Mijn Toeslagen. Te veel toeslag moet je terugbetalen.
voorwaarden:
  - Je hebt een Nederlandse zorgverzekering.
  - Je bent 18 jaar of ouder.
  - >-
    Je toetsingsinkomen in 2026 is niet hoger dan € 40.857, of € 51.142 samen met een
    toeslagpartner.
  - Je vermogen op 1 januari 2026 is niet hoger dan € 146.011, of € 184.633 samen.
