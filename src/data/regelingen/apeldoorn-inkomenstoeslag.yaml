slug: apeldoorn-inkomenstoeslag
naam: Individuele inkomenstoeslag in Apeldoorn
categorie: gemeente
gemeente: apeldoorn
samenvatting: >-
  Woon je in Apeldoorn en heb je 3 jaar of langer een laag inkomen, zonder zicht op meer? Dan
  kun je één keer per 12 maanden individuele inkomenstoeslag krijgen. Dezelfde bedragen noemt de
  gemeente ook voor Epe en Brummen.
voorWie: Inwoners van 21 jaar of ouder zonder AOW, die niet studeren en niet in de gevangenis zitten.
bedragKort: € 350, € 450 of € 500
bedrag: >-
  De gemeente noemt € 350 als je alleen bent zonder kinderen onder de 18, € 450 als je alleen
  bent mét kinderen onder de 18, en € 500 als je getrouwd bent of samenwoont. Vermogen onder de
  grens uit de Participatiewet: € 8.000 of € 16.000, zoals de pagina die opschrijft.
bedragZeker: false
deadline: >-
  Eén keer per 12 maanden. Je of je partner heeft in de afgelopen 12 maanden geen individuele
  inkomenstoeslag gekregen.
deadlineZeker: true
stappen:
  - Ga naar apeldoorn.nl en open de inkomensgrenzen van de individuele inkomenstoeslag.
  - Klik op aanvragen en log in met DigiD. Vul het formulier in en verstuur het.
  - Woon je in Epe of Brummen, dan gebruik je dezelfde pagina. Deze site gaat over Apeldoorn.
voorwaarden:
  - Je bent 21 jaar of ouder en je of je partner heeft nog geen AOW.
  - Je hebt geprobeerd meer inkomen te krijgen en de kans daarop is klein.
  - Je studeert niet op het moment van de aanvraag.
bronnen:
  - naam: Gemeente Apeldoorn — individuele inkomenstoeslag
    url: https://www.apeldoorn.nl/individuele-inkomenstoeslag
laatstGecontroleerd: "2026-10-16"
onzeker:
  - Bij de bedragen staat geen jaartal. Of ze in 2026 gelden, is te controleren.
trefwoorden:
  - apeldoorn
  - iit
check:
  soort: inkomenstoeslag
  minLeeftijd: 21
  geenAow: true
