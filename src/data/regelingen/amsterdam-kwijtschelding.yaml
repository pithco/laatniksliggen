slug: amsterdam-kwijtschelding
naam: Kwijtschelding belastingen in Amsterdam
categorie: gemeente
gemeente: amsterdam
samenvatting: >-
  Als u weinig geld hebt, kunt u in Amsterdam kwijtschelding van gemeentelijke belastingen
  aanvragen. Doe eerst de checklist op de site. U ziet dan of aanvragen zin heeft.
voorWie: Inwoners met een laag inkomen en weinig vermogen, van wie de aanslag op hun naam staat.
bedragKort: De aanslag, of een deel ervan. Geen vast bedrag
bedrag: >-
  U betaalt de belasting niet, of maar een deel. Hoeveel dat is, hangt af van de aanslag. De
  inkomens- en vermogensbedragen staan op de pagina Inkomen en vermogen bij kwijtschelding. Die
  eurogrenzen hebben we niet apart overgenomen.
bedragZeker: false
deadline: >-
  De aanslag staat op uw naam en u hebt hem nog niet (helemaal) betaald, of u betaalde hem
  korter dan 3 maanden geleden. Een besluit volgt na 8 weken, of de gemeente vraagt eerst meer
  informatie.
deadlineZeker: true
stappen:
  - Doe de checklist op amsterdam.nl.
  - Vraag de kwijtschelding online aan.
  - >-
    Voor waterschapsbelasting van Waterschap Amstel, Gooi en Vecht belt u Belastingen: 020 255
    4800.
voorwaarden:
  - >-
    Kwijtschelding kan onder meer voor afvalstoffenheffing, onroerendezaakbelasting,
    roerenderuimtebelasting, liggeld voor een woonboot en rioolheffing bij een waterverbruik van
    meer dan 300 m³.
  - De gemeente kijkt naar inkomen, geld op rekeningen en ander vermogen.
bronnen:
  - naam: Gemeente Amsterdam — kwijtschelding
    url: https://www.amsterdam.nl/belastingen/kwijtschelding/
laatstGecontroleerd: "2026-10-16"
onzeker:
  - >-
    De actuele inkomens- en vermogensbedragen staan op een aparte pagina en zijn hier te
    controleren.
trefwoorden:
  - amsterdam
  - belasting
  - afvalstoffenheffing
check:
  soort: kwijtschelding
  minLeeftijd: 18
