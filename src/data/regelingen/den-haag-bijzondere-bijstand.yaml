slug: den-haag-bijzondere-bijstand
naam: Bijzondere bijstand in Den Haag
categorie: gemeente
gemeente: den-haag
samenvatting: >-
  Bijzondere bijstand in Den Haag is geld voor onverwachte, noodzakelijke kosten. Je hoeft geen
  uitkering te hebben. Vraag eerst aan, en betaal de kosten daarna. Het geld kan een gift zijn
  of een lening.
voorWie: >-
  Inwoners van Den Haag van 21 jaar of ouder die de kosten niet zelf kunnen betalen en geen
  andere regeling hebben.
bedragKort: Geen vast bedrag. Besluit binnen 8 weken
bedrag: >-
  De gemeente kijkt of je alle kosten kunt betalen of een deel. Een standaardbedrag staat niet
  op de pagina. Je krijgt het bedrag op je rekening als de aanvraag slaagt.
bedragZeker: true
deadline: >-
  Geen vaste sluitingsdatum. De gemeente wil dat je eerst aanvraagt en pas daarna betaalt. Een
  besluit volgt binnen 8 weken.
deadlineZeker: true
stappen:
  - Ga naar denhaag.nl en open bijzondere bijstand. Kijk of jouw kosten op de lijst staan.
  - Bel de klantenservice op 070 353 75 00 en toets 3. Vraag het formulier op.
  - >-
    Stuur het formulier per post, of lever het in bij de advies- en informatiebalie. Het adres
    staat op het formulier.
voorwaarden:
  - Je woont in Den Haag en je bent 21 jaar of ouder.
  - >-
    Wel mogelijk: wonen en meubels, medische hulp, financiële hulp en rechtsbijstand. Soms ook
    andere kosten.
  - >-
    Niet mogelijk: paspoort of identiteitskaart, telefoon, boetes, schulden, eigen risico van de
    zorgverzekering, alimentatie of de jaarnota energie.
bronnen:
