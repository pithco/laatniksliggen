slug: onterecht-betaalde-belasting
naam: Te veel betaalde belasting
categorie: belasting
gemeente: ""
samenvatting: >-
  Krijg je AOW én een klein pensioen, of meerdere uitkeringen naast elkaar? Dan houdt elke
  betaler apart belasting in. Samen kan dat te veel zijn. Dat geld krijg je alleen terug als je
  aangifte doet.
voorWie: >-
  Mensen met meer dan één inkomen, zoals AOW plus pensioen, of een uitkering plus een klein
  baantje. Ook als je geen brief kreeg dat je aangifte moet doen.
bedragKort: Het te veel ingehouden bedrag. Zichtbaar in de aangifte
bedrag: >-
  Er is geen vast bedrag. De Belastingdienst schrijft dat je het ziet zodra je de aangifte
  invult. Heb je het hele jaar de AOW-leeftijd, dan gelden lagere tarieven en andere
  heffingskortingen. Daardoor kan er te veel zijn ingehouden, maar soms ook te weinig. Zie je
  dat je € 58 of meer moet betalen, dan moet je de aangifte juist wél insturen.
bedragZeker: true
deadline: >-
  Je kunt tot 5 jaar terug aangifte doen. In 2026 gaat dat over 2021 tot en met 2025. Aangifte
  over 2021 moet uiterlijk 31 december 2026 binnen zijn.
deadlineZeker: true
stappen:
  - Leg de jaaropgaven van de SVB, je pensioenfonds, het UWV of je werkgever bij elkaar.
  - >-
    Ga naar Mijn Belastingdienst op belastingdienst.nl. Log in met DigiD. Vul de aangifte in als
    proef en verstuur nog niks.
  - Zie je dat je geld terugkrijgt, klik dan op versturen.
voorwaarden:
  - >-
    Er is loonheffing ingehouden door meer dan één instantie, of de heffingskorting is niet
    volledig gebruikt.
  - >-
    Je hoeft de aangifte niet te versturen als je alleen wil kijken, behalve als je moet
    bijbetalen of een aangiftebrief hebt.
