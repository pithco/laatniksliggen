laatstGecontroleerd: "2026-10-16"
onzeker:
  - >-
    De inkomensgrenzen wijken af tussen twee pagina’s van de Rijksoverheid. De
    vraag-en-antwoordpagina noemt eurobedragen met een gat ertussen. Het nieuwsbericht noemt
    130% en 200% van het sociaal minimum. De precieze grens is te controleren.
  - >-
    Of uw eigen gemeente in 2026 nog een lokale energietoeslag heeft, is te controleren op de
    site van de gemeente.
