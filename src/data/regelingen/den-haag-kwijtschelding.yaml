slug: den-haag-kwijtschelding
naam: Kwijtschelding belastingen in Den Haag
categorie: gemeente
gemeente: den-haag
samenvatting: >-
  Met een laag inkomen kun je in Den Haag kwijtschelding vragen. Je betaalt dan niets, of maar
  een deel. Aanvragen kan met DigiD of per post.
voorWie: Inwoners met een laag inkomen die de aanslag moeilijk kunnen betalen.
bedragKort: Niets of een deel van de aanslag
bedrag: >-
  Het voordeel is de belasting die je niet hoeft te betalen. Welke aanslag je hebt, bepaalt het
  bedrag. De gemeente noemt geen vast eurobedrag.
bedragZeker: true
deadline: >-
  Er staat geen vaste aanvraagdatum op de pagina. Je kunt ook extra stukken nasturen of beroep
  instellen tegen een afwijzing.
deadlineZeker: true
stappen:
  - >-
    Ga naar de kwijtscheldingspagina van Den Haag. Beantwoord eerst de vragen. Zo zie je of je
    kunt aanvragen.
  - Log in met DigiD en vul de aanvraag in. Lukt dat niet, vraag dan een papieren formulier.
  - Ben je het niet eens met een afwijzing, dien dan beroep in met hetzelfde formulier.
voorwaarden:
  - >-
    Kwijtschelding kan voor afvalstoffenheffing, onroerendezaakbelasting, rioolheffing
    eigenarendeel, liggeld voor woonschepen en niet-zakelijke belasting als je een Bbz-uitkering
    hebt.
bronnen:
  - naam: Gemeente Den Haag — kwijtschelding
    url: https://www.denhaag.nl/nl/belastingen/kwijtschelding-belastingen-aanvragen-of-regelen/
laatstGecontroleerd: "2026-10-16"
onzeker: []
trefwoorden:
