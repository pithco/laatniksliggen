slug: den-haag-inkomenstoeslag
naam: Individuele inkomenstoeslag in Den Haag
categorie: gemeente
gemeente: den-haag
samenvatting: >-
  Heb je al lang een laag inkomen? Dan kun je in Den Haag eens per 12 maanden individuele
  inkomenstoeslag krijgen, bijvoorbeeld voor een koelkast of wasmachine. Heb je bijstand en
  kreeg je de toeslag al, dan stuurt de gemeente vaak zelf een formulier.
voorWie: >-
  Inwoners van 21 jaar of ouder, nog zonder AOW, die 36 maanden gemiddeld niet boven 110% van
  het bijstandsniveau zaten en vermogen onder de grens hebben.
bedragKort: te controleren
bedrag: >-
  Op de pagina die we hebben gelezen staat wel waarvoor je het geld kunt gebruiken, maar geen
  eurobedrag. Het bedrag is te controleren.
bedragZeker: false
deadline: >-
  Je krijgt het geld één keer per 12 maanden. Heb je bijstand en recht, dan komt er een
  formulier in de maand waarin je weer recht hebt. Na 1 week nog niets ontvangen? Vraag dan zelf
  aan.
deadlineZeker: true
stappen:
  - >-
    Vraag online aan met het formulier op denhaag.nl. Lukt dat niet, stuur het papieren
    formulier naar Dienst SZW, antwoordnummer 1630, 2502 VB Den Haag.
  - Stuur een bankoverzicht mee van de vorige maand. Download dat bij je bank.
  - >-
    Heb je bijstand en kreeg je vorig jaar deze toeslag, controleer dan het formulier dat de
    gemeente stuurt. Stuur het terug als het klopt.
voorwaarden:
  - Je woont in Den Haag, je bent 21 jaar of ouder en je hebt nog geen AOW.
  - >-
    Je kreeg in de afgelopen 36 maanden geen studiefinanciering. Kortere studie kan een
    uitzondering zijn.
  - Je gemiddelde inkomen over 36 maanden was maximaal 110% van het bijstandsniveau.
bronnen:
  - naam: Gemeente Den Haag — individuele inkomenstoeslag
    url: https://www.denhaag.nl/nl/geld-en-schulden/individuele-inkomenstoeslag-aanvragen/
laatstGecontroleerd: "2026-10-16"
onzeker:
  - >-
    Het eurobedrag van de Haagse individuele inkomenstoeslag is te controleren. Het stond niet
    in de tekst die we hebben bekeken.
trefwoorden:
