slug: zaanstad-inkomenstoeslag
naam: Individuele inkomenstoeslag in Zaanstad
categorie: gemeente
gemeente: zaanstad
samenvatting: >-
  Heb je 5 jaar of langer een laag inkomen en heb je geprobeerd meer te verdienen? Dan kun je in
  Zaanstad individuele inkomenstoeslag aanvragen.
voorWie: >-
  Inwoners van 23 jaar of ouder die nog geen pensioen krijgen, 5 jaar een laag inkomen hadden en
  geen studiefinanciering ontvingen.
bedragKort: € 443, € 627 of € 695
bedrag: >-
  De gemeente noemt € 443 voor een alleenstaande, € 627 voor een alleenstaande ouder met
  kinderen tot 18 jaar, en € 695 voor een paar of gezin met minimaal twee volwassenen. Een
  jaartal staat niet bij deze bedragen.
bedragZeker: false
deadline: >-
  De pagina noemt geen sluitingsdatum. Heb je een bijstandsuitkering, dan hoeft je geen
  bewijsstukken mee te sturen.
deadlineZeker: true
stappen:
  - Ga naar zaanstad.nl en open de pagina waar de inkomens- en vermogensgrens staat.
  - >-
    Klik op aanvragen en log in met DigiD als daarom gevraagd wordt. Heb je een
    bijstandsuitkering, vul dan “PW-uitkering” in.
  - Heb je geen uitkering, stuur dan inkomensbewijzen mee.
voorwaarden:
  - Je bent 23 jaar of ouder en je krijgt nog geen pensioen.
  - Je hebt 5 jaar een laag inkomen en je hebt genoeg gedaan om werk te vinden of te houden.
  - Je ontving de afgelopen 5 jaar geen studiefinanciering of tegemoetkoming voor schoolkosten.
