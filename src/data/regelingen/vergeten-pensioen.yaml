slug: vergeten-pensioen
naam: Vergeten pensioen
categorie: vergeten
gemeente: ""
samenvatting: >-
  Heb je ergens gewerkt en ben je vergeten dat je daar pensioen opbouwde? Of is een
  pensioenfonds je adres kwijt? Op Mijnpensioenoverzicht.nl zie je welk pensioen er op je naam
  staat. Je logt in met DigiD.
voorWie: >-
  Mensen die in Nederland wonen of een DigiD hebben en willen zien welk pensioen er voor hen
  klaarstaat. Ook als je al met pensioen bent, is het de moeite waard om te kijken of er een
  klein potje mist.
bedragKort: Hangt af van wat je hebt opgebouwd. Geen vast bedrag
bedrag: >-
  Er is geen standaardbedrag. Je ziet op het overzicht wat er is opgebouwd en vanaf wanneer het
  ingaat. Een pensioenfonds kan geld niet uitkeren als het je adres niet heeft. De
  contactgegevens voor zo’n vergeten pensioen staan bij het overzicht.
bedragZeker: true
deadline: >-
  Inloggen kan het hele jaar. Per pensioenfonds kunnen eigen termijnen gelden om een pensioen
  alsnog uit te laten keren. Die termijn is te controleren bij het fonds dat je op het overzicht
  ziet.
deadlineZeker: false
stappen:
  - Heb je nog geen DigiD, vraag die dan eerst aan op digid.nl. Dat duurt een paar dagen.
  - Ga naar mijnpensioenoverzicht.nl en log in met DigiD.
  - >-
    Mis je een pensioen, bel of mail dan het fonds dat daarbij hoort. Het overzicht laat zien
    welk fonds dat is.
voorwaarden:
  - Je hebt DigiD nodig om je eigen gegevens te zien.
  - >-
    Het overzicht gaat over pensioen dat in Nederland is opgebouwd bij fondsen en verzekeraars
    die meedoen.
  - AOW zie je apart bij de SVB. Die staat niet als vervanging van dit overzicht.
bronnen:
  - naam: Mijnpensioenoverzicht.nl
    url: https://www.mijnpensioenoverzicht.nl/
laatstGecontroleerd: "2026-10-16"
onzeker:
  - >-
    Een algemene uiterste datum om vergeten pensioen alsnog op te eisen hebben we niet op
    mijnpensioenoverzicht.nl gevonden. Die termijn is te controleren bij het pensioenfonds.
trefwoorden:
  - pensioen
  - digid
  - mijnpensioenoverzicht
  - fonds
check:
  soort: pensioen
  minLeeftijd: 18
